<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>試合配信画面 - クイズ大会スタジオ</title>
<style>
@font-face{font-family:'Agency FB';src:url('../fonts/AGENCYB.TTF'),local('Agency FB Bold');font-weight:100 900;unicode-range:U+0020-007E,U+2010-2027}
@font-face{font-family:'BIZ UDPGothic';src:local('BIZ UDPGothic Bold'),local('BIZ UDPゴシック Bold'),url('../fonts/BIZUDPGothic-Bold.ttf');font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Agency FB','BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif}
body.bg-transparent{background:transparent}
body.bg-green{background:#00b140}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#000;overflow:hidden}
body.bg-transparent #stage{background:transparent}
.jp{font-family:'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif}
.en{font-family:'Agency FB','BIZ UDPGothic',sans-serif}

/* ---------- ヘッダー ---------- */
.hd{position:absolute;left:0;top:0;width:1920px;height:170px}
.hd svg{position:absolute;left:0;top:0}
.hd .rl{position:absolute;left:150px;top:22px;height:96px;display:flex;align-items:center;color:#111;font-size:84px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.hd .rl .x{font-size:.55em;margin-left:2px}
.hd .grp{position:absolute;left:560px;top:104px;font-size:66px;line-height:1;font-weight:900;white-space:nowrap;letter-spacing:1px}
.hd .grp b{margin-left:70px}
.hd .logo{position:absolute;right:58px;top:34px;line-height:1;font-size:58px;font-weight:900;font-style:italic;letter-spacing:2px;transform:skewX(-12deg);white-space:nowrap;max-width:640px;overflow:hidden;text-overflow:ellipsis}
.hd .chev{position:absolute;left:1000px;top:44px;font-size:46px;font-weight:900;letter-spacing:-6px;opacity:.95}

/* ---------- 問題 ---------- */
.qa{position:absolute;left:110px;right:110px;top:178px;height:150px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
.qa .q{font-size:var(--qfs,38px);font-weight:700;line-height:1.35}
.qa .a{font-size:42px;font-weight:700;color:#ffe14a}
.qa.hid{visibility:hidden}

/* ---------- 名札 ---------- */
.pl{position:absolute;left:40px;right:40px;top:340px;height:560px;display:flex;justify-content:center;gap:var(--gap,20px)}
.pc{position:relative;width:var(--pw,150px);height:100%;background:#fff;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.06),6px 8px 0 rgba(0,0,0,.6);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:background .3s}
.pc .fill{position:absolute;left:0;right:0;bottom:0;background:#36c443;transition:height .5s cubic-bezier(.2,.9,.3,1.2)}
.pc.win{background:#e59a1f}.pc.win .fill{display:none}
.pc.lose{background:#5a5a5a}.pc.lose .fill{display:none}
.pc .tri{position:absolute;width:0;height:0;z-index:2}
.pc .tri.tl{left:0;top:0;border-top:var(--ts,64px) solid var(--c);border-right:var(--ts,64px) solid transparent}
.pc .tri.br{right:0;bottom:0;border-bottom:var(--ts,64px) solid var(--c);border-left:var(--ts,64px) solid transparent}
.pc .in{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.stk{color:#fff;-webkit-text-stroke:var(--sw,7px) var(--sc,#1e7a2c);paint-order:stroke fill}
.pc.win .stk{--sc:#8a4d00}.pc.lose .stk{--sc:#222}
.pc .pr{font-size:calc(var(--pw) * .4);font-weight:900;line-height:1;height:calc(var(--pw) * .42);white-space:nowrap}
.pc .body{flex:1;width:100%;display:flex;justify-content:center;gap:calc(var(--pw) * .02);padding:calc(var(--pw) * .08) 0 calc(var(--pw) * .12)}
.pc .nm{display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:var(--nfs,70px);font-weight:900;line-height:1}
.pc .nm span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.02em;white-space:nowrap}
.pc .nm.one{justify-content:flex-start}
.pc .af{writing-mode:vertical-rl;text-orientation:upright;font-size:var(--afs,26px);font-weight:900;white-space:nowrap;overflow:hidden;max-height:100%;--sw:5px;padding-top:calc(var(--pw) * .02)}

/* ---------- 得点 ---------- */
.st{position:absolute;left:40px;right:40px;top:915px;height:100px;display:flex;justify-content:center;gap:var(--gap,20px)}
.sc{width:var(--pw,150px);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.sc .n{font-size:var(--sfs,84px);font-weight:900;color:#f3e33a;line-height:1;-webkit-text-stroke:6px #2a5b10;paint-order:stroke fill}
.sc .n .br{color:#f3e33a;font-size:.86em}
.sc .rk{font-size:calc(var(--sfs,84px) * .82);font-weight:900;color:#fff;line-height:1}
.sc .rk.lose{color:#fff}
.sc .dots{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;line-height:1}
.sc .dots i{font-style:normal;font-size:calc(var(--sfs,84px) * .36);height:calc(var(--sfs,84px) * .36);display:flex;align-items:center}
.sc .dots i.x{color:#ff3b3b;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
.sc .dots i.d::before{content:'';width:calc(var(--sfs,84px) * .13);height:calc(var(--sfs,84px) * .13);border-radius:50%;background:#e8e8e8}
.sc .sub{font-size:calc(var(--sfs,84px) * .36);color:#9fd;font-weight:900}
.pop{animation:pop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---------- 下のバー（限定問題数） ---------- */
.ft{position:absolute;left:0;right:0;top:1018px;height:62px}
.ft .lg{position:absolute;left:60px;top:6px;font-size:42px;text-overflow:ellipsis;font-weight:900;font-style:italic;transform:skewX(-12deg);white-space:nowrap;max-width:440px;overflow:hidden}
.ft .play{position:absolute;left:520px;top:8px;width:0;height:0;border-left:40px solid #fff;border-top:24px solid transparent;border-bottom:24px solid transparent}
.ft .bar{position:absolute;left:600px;right:480px;top:26px;height:12px;border-radius:6px;background:#3b3b3b;overflow:hidden}
.ft .bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:6px;transition:width .5s}
.ft .cnt{position:absolute;right:60px;top:-4px;display:flex;align-items:center;gap:12px;font-size:60px;font-weight:900;white-space:nowrap}
.ft .cnt .sk{display:inline-block;width:0;height:0;border-top:24px solid transparent;border-bottom:24px solid transparent}
.ft .cnt .sk.l{border-right:34px solid #fff;box-shadow:-8px 0 0 -2px #fff}
.ft .cnt .sk.r{border-left:34px solid #fff;box-shadow:8px 0 0 -2px #fff}
.ft .cnt .sep{width:4px;height:44px;background:#fff;margin:0 6px}
.empty{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:48px;color:#777}
#rs{position:fixed;right:8px;bottom:6px;font:12px sans-serif;color:#888}
/* ---------- スマホ縦 ---------- */
#stage.port{width:1080px;height:1920px}
#stage.port .hd{transform:scale(.5625);transform-origin:0 0}
#stage.port .qa{left:30px;right:30px;top:110px;height:330px;--qfs:44px!important}
#stage.port .qa .a{font-size:50px}
#stage.port .pl{left:20px;right:20px;top:460px;height:1160px}
#stage.port .st{left:20px;right:20px;top:1640px;height:130px}
#stage.port .ft{top:1800px;height:120px}
#stage.port .ft .lg{display:none}
#stage.port .ft .play{left:40px;top:30px}
#stage.port .ft .bar{left:110px;right:40px;top:48px}
#stage.port .ft .cnt{right:auto;left:0;width:100%;justify-content:center;top:-40px;font-size:50px}
#stage.port.d3 .floor{top:1620px}
.empty{width:100%}
/* ---------- 登場：上から降ってくる ---------- */
.p3{position:relative;width:var(--pw,150px);height:100%;flex:none}
.p3 > .pc{width:100%}
.pl.hid,.st.hid{visibility:hidden}
.p3.drop{animation:drop .75s cubic-bezier(.3,0,.4,1) backwards}
@keyframes drop{0%{transform:translateY(-1100px)}70%{transform:translateY(0)}82%{transform:translateY(-34px)}100%{transform:translateY(0)}}
.sc.drop{animation:scIn .35s ease-out backwards}
@keyframes scIn{from{opacity:0;transform:scale(1.8)}}
/* ---------- Attack Survival のライフ ---------- */
.pc .life{position:absolute;inset:0;display:flex;flex-direction:column-reverse;gap:3px;padding:3px}
.pc .life i{flex:1;background:var(--lc,#36c443);transition:background .3s}
.pc .life i.e{background:transparent}
.pc .life i.lost{background:#fff;animation:lost .9s ease-in forwards}
@keyframes lost{0%{background:#fff}25%{background:#ff3b3b}100%{background:#ff3b3b;opacity:0;transform:scaleX(.2)}}
.pc.dmg{animation:dmg .45s}
@keyframes dmg{0%{filter:brightness(2.2)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}100%{filter:none}}
.pc.low .life i:not(.e){animation:low 1s steps(2) infinite}
@keyframes low{50%{opacity:.45}}
.sc .lifeL{font-size:calc(var(--sfs,84px) * .3);font-weight:900;color:#fff;align-self:flex-end;margin-bottom:.5em}
.sc .hit{position:absolute;top:-.9em;left:0;right:0;text-align:center;font-size:calc(var(--sfs,84px) * .55);font-weight:900;color:#ff3b3b;-webkit-text-stroke:4px #fff;paint-order:stroke fill;animation:hit 1.1s ease-out forwards}
@keyframes hit{from{transform:translateY(20px);opacity:1}to{transform:translateY(-60px);opacity:0}}
.sc{position:relative}
/* ---------- 3D デザイン ---------- */
#stage.d3{background:radial-gradient(ellipse at 50% 120%,#2a2a2a 0%,#000 60%)}
#stage.d3 .floor{position:absolute;left:-400px;right:-400px;top:880px;height:600px;transform:perspective(900px) rotateX(72deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 2px,transparent 2px 120px),repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 2px,transparent 2px 120px)}
#stage.d3 .pl{perspective:1700px;perspective-origin:50% -10%;transform-style:preserve-3d}
#stage.d3 .pl{transform:translateY(20px)}
#stage.d3 .p3{transform-style:preserve-3d;transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px))}
#stage.d3 .p3 > .pc{position:absolute;inset:0;box-shadow:none}
#stage.d3 .p3 .sd{position:absolute;top:0;bottom:0;left:100%;width:var(--dp,26px);background:var(--c);filter:brightness(.45);transform:rotateY(90deg);transform-origin:0 50%}
#stage.d3 .p3 .sl{position:absolute;top:0;bottom:0;right:100%;width:var(--dp,26px);background:var(--c);filter:brightness(.45);transform:rotateY(-90deg);transform-origin:100% 50%}
#stage.d3 .p3 .tp{position:absolute;left:0;right:0;bottom:100%;height:var(--dp,26px);background:#cfcfcf;transform:rotateX(-90deg);transform-origin:50% 100%}
#stage.d3 .p3.win .tp{background:#b8780f}#stage.d3 .p3.lose .tp{background:#333}
#stage.d3 .p3 .sh{position:absolute;left:-10%;right:-10%;bottom:-40px;height:60px;background:radial-gradient(ellipse,rgba(0,0,0,.8),transparent 70%);transform:rotateX(90deg)}
#stage.d3 .p3.lose{transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px)) rotateX(-22deg);transform-origin:50% 100%}
#stage.d3 .p3.lose.ev{animation:fall3 .6s cubic-bezier(.5,0,.7,1) backwards}
@keyframes fall3{from{transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px))}}
#stage.d3 .p3.win.ev{animation:spin3 1s cubic-bezier(.3,.7,.3,1) backwards}
@keyframes spin3{from{transform:rotateY(calc(var(--ry,0deg) - 360deg)) translateZ(var(--tz,0px)) translateY(-60px)}}
#stage.d3 .p3.drop{animation:drop3 .8s cubic-bezier(.3,0,.4,1) backwards}
@keyframes drop3{0%{transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px)) translateY(-1100px) rotateX(-40deg)}70%{transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px)) translateY(0)}82%{transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px)) translateY(-30px)}100%{transform:rotateY(var(--ry,0deg)) translateZ(var(--tz,0px))}}
#stage.d3 .sc .n,#stage.d3 .sc .rk{text-shadow:0 2px 0 #1b3a0a,0 4px 0 #1b3a0a,0 6px 0 #1b3a0a,0 8px 0 #0e2005,0 14px 18px rgba(0,0,0,.8)}
#stage.d3 .st{perspective:900px}
#stage.d3 .sc{transform:rotateX(18deg)}
</style>
</head>
<body>
<iframe id="frame"></iframe>
<div id="stage"></div>
<div id="rs"></div>
<script>if (/[?&]cloud=1/.test(location.search)) document.write('<script src="../mqtt.min.js"><\/script><script src="remote.js"><\/script>');</script>
<script src="tournament-core.js"></script>
<script src="quiz-core.js"></script>
<script src="intro3d.js"></script>
<script>
const TC = window.TournamentCore;
const Q = new URLSearchParams(location.search);
const REMOTE = Q.get('remote') === '1';
document.body.classList.add('bg-' + (Q.get('bg') || 'dark'));
const store = {};
const get = k => REMOTE ? (store[k] == null ? null : store[k]) : localStorage.getItem(k);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stage = document.getElementById('stage'), frame = document.getElementById('frame');
// スマホ（?phone=1）を縦に持った時は 1080×1920 の縦長レイアウト
const PHONE = Q.get('phone') === '1';
let PORT = false;
function fit() {
  const port = PHONE && innerHeight > innerWidth * 1.15;
  if (port !== PORT) { PORT = port; stage.classList.toggle('port', port); render.last = null; setTimeout(() => schedule(), 0); }
  const W = PORT ? 1080 : 1920, H = PORT ? 1920 : 1080;
  const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();
const ord = n => { n = Number(n) || 0; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const pad2 = n => String(n).padStart(2, '0');
const qClock = n => `${Math.floor(n / 100)}:${pad2(n % 100)}`;

function state() {
  let players = [], rules = {}, T = null;
  try { players = JSON.parse(get('quiz_players')) || []; } catch (e) { }
  try { rules = Object.assign({}, QuizCore.DEFAULT_RULES, JSON.parse(get('quiz_rules')) || {}); } catch (e) { rules = Object.assign({}, QuizCore.DEFAULT_RULES); }
  try { T = JSON.parse(get(TC.KEY)); if (T && Array.isArray(T.entries)) TC.ensure(T); else T = null; } catch (e) { }
  return { players, rules, T };
}
function ruleText(rules) {
  if (rules.ruleNameMode === 'custom' && rules.customRuleName) return rules.customRuleName;
  return TC.ruleLabel({ ruleType: rules.ruleType, winLimit: rules.winLimit, loseLimit: rules.loseLimit, extraLimit: rules.extraLimit });
}
function headerSvg() {
  // 白い斜めパネル＋縞模様＋ライン
  let stripes = '';
  for (let i = 0; i < 9; i++) { const x = 40 + i * 44; stripes += `<polygon points="${x},148 ${x + 22},148 ${x + 44},120 ${x + 22},120" fill="#fff"/>`; }
  return `<svg width="1920" height="170" viewBox="0 0 1920 170">
    <polygon points="110,18 520,18 470,112 40,112" fill="#fff"/>
    ${stripes}
    <polyline points="560,62 620,30 1170,30" fill="none" stroke="#fff" stroke-width="5"/>
    <polyline points="500,150 540,98 980,98 1060,30" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="1170" cy="30" r="13" fill="#fff"/>
    <polyline points="1170,30 1235,104 1880,104" fill="none" stroke="#fff" stroke-width="4"/>
    <line x1="1180" y1="30" x2="1500" y2="30" stroke="#fff" stroke-width="3"/>
    <polygon points="1500,22 1518,30 1500,38" fill="#fff"/>
    <line x1="1240" y1="118" x2="1880" y2="118" stroke="#fff" stroke-width="3"/>
  </svg>`;
}

const prev = {};
// ---- 登場（紹介が終わったら／組が替わったら、順位が高い順に上から降ってくる） ----
const DROP_GAP = 300;
let dropG = { gid: undefined, start: 0, t0: 0 };
let needTick = false;
function dropFor(gid, n, now) {
  if (dropG.gid !== gid) dropG = { gid, start: dropG.gid === undefined ? 0 : now, t0: 0 };
  const s = gid && window.QTIntro ? QTIntro.status(get, 'qt_intro', gid, n) : null;
  if (s && s.active) { needTick = true; return { hide: true }; }
  const start = s ? s.endedAt - 250 : dropG.start;
  const dur = 1400 + n * DROP_GAP * 1.5;
  if (!start || now - start > dur) { needTick = !!s && now - start < dur + 500; return null; }
  if (dropG.start !== start || !dropG.t0) { dropG.start = start; dropG.t0 = now; setTimeout(schedule, dur - (now - start) + 50); }
  needTick = false;
  return { start, t0: dropG.t0 };
}
// ---- Attack Survival：減ったライフのコマが白→赤で砕ける・札が揺れる・-n が浮く ----
const lifeMem = {};
function lifeFx(id, life, max, now) {
  let L = lifeMem[id];
  if (!L) L = lifeMem[id] = { life, at: 0, from: life, hit: 0 };
  else if (life < L.life) { L.from = L.life; L.hit = L.life - life; L.at = now; L.life = life; }
  else if (life > L.life) { L.life = life; L.at = 0; L.hit = 0; }
  const cells = Math.min(max, 30), per = max / cells;
  const on = Math.ceil(life / per - 1e-9), was = Math.ceil(L.from / per - 1e-9);
  const fresh = L.at && now - L.at < 900;
  const ratio = life / max, lc = ratio > .5 ? '#36c443' : ratio > .25 ? '#f2b705' : '#e53935';
  let h = `<div class="life" style="--lc:${lc}">`;
  for (let i = 0; i < cells; i++) h += i < on ? '<i></i>' : fresh && i < was ? `<i class="lost" style="animation-delay:${L.at - now + (i - on) * 40}ms"></i>` : '<i class="e"></i>';
  return { html: h + '</div>', dmg: fresh && now - L.at < 450 ? L.at - now : 0, low: ratio <= .2 };
}
// 勝ち抜け／敗退した瞬間（3Dの回転・倒れる演出用）
const evMem = {};
function evFx(id, cls, now) {
  const m = evMem[id];
  if (!m) { evMem[id] = { cls, at: 0 }; return 0; }
  if (m.cls !== cls) { m.cls = cls; m.at = cls ? now : 0; }
  return m.at && now - m.at < 1000 ? (m.at - now) || -1 : 0;
}
setInterval(() => { if (needTick) schedule(); }, 250);
function hdSize(t) { const w = [...String(t)].reduce((a, c) => a + (/[\x20-\x7e]/.test(c) ? .46 : 1), 0); return Math.max(40, Math.min(84, Math.floor(400 / Math.max(w, 1)))); }
function renderPlate(st) {
  const { players, rules, T } = st;
  const stage_ = players.filter(p => p.pool !== 'waiting');
  const total = stage_.reduce((a, p) => a + (p.circles || 0), 0);
  // 大会運営とつながっていれば、ラウンド名・組・ペーパー順位・所属を使う
  let round = null, group = null, gi = 0;
  const tm = stage_.find(p => p.tmt);
  if (T && tm) T.rounds.forEach(r => r.groups.forEach((g, i) => { if (g.id === tm.tmt.gid) { round = r; group = g; gi = i; } }));
  const pr = T ? TC.paperRanks(T) : {};
  const ent = id => T && T.entries.find(e => e.id === id);
  const adv = rules.groupWinTarget || (round ? round.advance : 0);
  const n = stage_.length;
  const gap = n > 12 ? 10 : n > 8 ? 16 : 22;
  const pw = Math.min(200, Math.floor(((PORT ? 1040 : 1840) - gap * (n - 1)) / Math.max(n, 1)));
  const canLose = !['ny', 'freeze', 'by', 'hitcombo', 'nxm', 'kobanzame', 'timerace'].includes(rules.ruleType);
  const isPt = (QuizCore.RULE_CONFIG[rules.ruleType] || {}).isPt;
  const qn = rules.questionNum || 1, lim = Number(rules.questionLimit) || 0;
  const title = (T && T.name) || 'QUIZ';
  const qfs = (rules.qText || '').length > 110 ? 32 : 38;
  const now = Date.now(), D3 = st.design === '3d';
  // 降ってくる順＝順位（ペーパー順位）が高い順
  const order = stage_.map((p, i) => ({ id: p.id, i, r: (p.tmt && pr[p.tmt.eid]) || 9999 })).sort((a, b) => a.r - b.r || a.i - b.i).map(x => x.id);
  const drop = dropFor(group ? group.id : null, n, now);

  let h = `<div class="hd">${headerSvg()}
    <div class="rl en" style="font-size:${hdSize((round ? round.name + ':' : '') + ruleText(rules))}px">${esc(round ? round.name + ':' : '')}${esc(ruleText(rules))}</div>
    <div class="grp en">${esc(group ? 'GROUP' + (gi + 1) + '.' : '')}${n ? `<b>${n}${adv ? '→' + adv : ''}</b>` : ''}</div>
    <div class="chev en">&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;</div>
    <div class="logo jp">${esc(title)}</div></div>`;
  const showQ = !rules.isTextHidden && (rules.qText || rules.aText);
  h += `<div class="qa jp ${showQ ? '' : 'hid'}" style="--qfs:${qfs}px">${rules.qText ? `<div class="q">Q.${esc(rules.qText)}</div>` : ''}${rules.showAnswer && rules.aText ? `<div class="a">Ans.${esc(rules.aText)}</div>` : ''}</div>`;
  if (!n) h += '<div class="empty jp">壇上にプレイヤーがいません</div>';

  const nfs = Math.round(Math.min(pw * (PORT ? .6 : .46), PORT ? 110 : 92)), afs = Math.round(Math.min(pw * .15, 30)), sfs = Math.round(Math.min(pw * .55, 96));
  let plates = '', stats = '';
  stage_.forEach((p, idx) => {
    const s = QuizCore.getStatus(p, rules, total);
    const e = p.tmt ? ent(p.tmt.eid) : null;
    const name = (e ? e.name : p.name) || '';
    const parts = name.trim().split(/[\s　]+/);
    const aff = e ? (e.affiliation || '') + (e.grade ? e.grade + (/年$/.test(e.grade) ? '' : '年') : '') : [p.c1, p.c2, p.cR].filter(Boolean).join('');
    const rank = e && pr[e.id] ? ord(pr[e.id]) : '';
    const cls = s.isWinner ? 'win' : s.isLoser ? 'lose' : '';
    const goal = rules.ruleType === 'by' ? rules.winLimit * rules.winLimit : rules.ruleType === 'melonpan' || rules.ruleType === 'attacksurvival' ? Math.max(1, rules.winLimit) : Math.max(1, rules.winLimit);
    const fill = Math.max(0, Math.min(100, (s.score / goal) * 100));
    const AS = rules.ruleType === 'attacksurvival' && !s.isWinner && !s.isLoser ? lifeFx(p.id, s.score, goal, now) : null;
    const ev = evFx(p.id, cls, now);
    const k = order.indexOf(p.id), mid = (n - 1) / 2, dx = idx - mid;
    const dropAttr = drop && drop.start ? ` drop" style="animation-delay:${Math.round(drop.start + k * DROP_GAP - drop.t0)}ms;` : '" style="';
    plates += `<div class="p3 ${cls}${ev ? ' ev' : ''}${dropAttr}--c:${esc(p.color || '#2fbf3a')};--ry:${(-dx * (D3 ? 5 : 0)).toFixed(1)}deg;--tz:${(D3 ? -dx * dx * 14 : 0).toFixed(0)}px${ev ? `;animation-delay:${ev}ms` : ''}">${D3 ? '<div class="sh"></div><div class="sl"></div><div class="sd"></div><div class="tp"></div>' : ''}<div class="pc ${cls}${AS && AS.dmg ? ' dmg' : ''}${AS && AS.low ? ' low' : ''}" style="--c:${esc(p.color || '#2fbf3a')}${AS && AS.dmg ? `;animation-delay:${AS.dmg}ms` : ''}">
      ${AS ? AS.html : `<div class="fill" style="height:${fill}%"></div>`}<div class="tri tl"></div><div class="tri br"></div>
      <div class="in"><div class="pr en stk">${esc(rank)}</div>
        <div class="body"><div class="nm jp ${parts.length > 1 ? '' : 'one'} stk">${parts.length > 1 ? `<span>${esc(parts[0])}</span><span>${esc(parts.slice(1).join(''))}</span>` : `<span>${esc(name)}</span>`}</div>
        ${aff ? `<div class="af jp stk">${esc(aff)}</div>` : ''}</div></div></div></div>`;
    // 得点の欄
    const key = p.id;
    let inner, sig;
    if (s.isWinner) { const o = p.clinchOrder || p.winOrder; inner = `<span class="rk en">${o ? ord(o) : 'WIN'}</span>`; sig = 'w' + o; }
    else if (s.isLoser) { inner = '<span class="rk lose en">lose</span>'; sig = 'l'; }
    else {
      const num = isPt ? s.score : (p.circles || 0);
      const v = p.volcano ? `<span class="br">〈</span>${num}<span class="br">〉</span>` : num;
      let dots = '';
      const L = rules.loseLimit || 0;
      if (canLose && !isPt && L > 0 && L <= 6) dots = `<span class="dots">${Array.from({ length: L }, (_, i) => i < (p.crosses || 0) ? '<i class="x en">×</i>' : '<i class="d"></i>').join('')}</span>`;
      else if (p.crosses) dots = `<span class="sub en">×${p.crosses}</span>`;
      if (p.freeze > 0) dots += `<span class="sub jp">休${p.freeze}</span>`;
      inner = `<span class="n en">${v}</span>${dots}`; sig = num + '|' + (p.crosses || 0) + '|' + !!p.volcano;
      if (rules.ruleType === 'attacksurvival') { const L = lifeMem[p.id]; inner = `<span class="n en">${s.score}</span><span class="lifeL en">LIFE</span>${L && L.hit && now - L.at < 1100 ? `<span class="hit en" style="animation-delay:${L.at - now}ms">-${L.hit}</span>` : ''}`; }
    }
    const pv = prev[key]; let anim = '';
    if (pv != null && pv !== sig) anim = (p.crosses || 0) > (pv.split('|')[1] | 0) && !s.isWinner ? 'shake' : 'pop';
    prev[key] = sig;
    stats += `<div class="sc ${anim}${drop && drop.start ? ' drop' : ''}"${drop && drop.start ? ` style="animation-delay:${Math.round(drop.start + (n + k) * DROP_GAP * .5 + 500 - drop.t0)}ms"` : ''}>${inner}</div>`;
  });
  const hid = drop && drop.hide ? ' hid' : '';
  h += `${D3 ? '<div class="floor"></div>' : ''}<div class="pl${hid}" style="--pw:${pw}px;--gap:${gap}px;--nfs:${nfs}px;--afs:${afs}px;--ts:${Math.round(pw * .36)}px;--dp:${Math.round(pw * .22)}px">${plates}</div>`;
  h += `<div class="st${hid}" style="--pw:${pw}px;--gap:${gap}px;--sfs:${sfs}px">${stats}</div>`;
  h += `<div class="ft"><div class="lg jp">${esc(title)}</div><div class="play"></div>
    <div class="bar"><i style="width:${lim ? Math.min(100, (qn - 1) / lim * 100) : 0}%"></i></div>
    <div class="cnt en"><span class="sk l"></span>${lim ? `${qClock(Math.min(qn, lim))}<span class="sep"></span>${qClock(lim)}` : `Q.${qn}`}<span class="sk r"></span></div></div>`;
  return h;
}

let mode = null;
function render() {
  const st = state();
  if (PHONE && st.rules.phoneDesign !== 'plate' && st.rules.phoneDesign !== '3d') { location.replace('display.html' + location.search.replace(/[?&]phone=1/, '').replace(/^&/, '?') + location.hash); return; }
  const design = PHONE ? st.rules.phoneDesign : (Q.get('design') || st.rules.matchDesign || 'display');
  if (design === 'display') {
    if (mode !== 'display') {
      mode = 'display'; stage.style.display = 'none'; frame.style.display = 'block';
      frame.src = 'display.html?' + (REMOTE ? 'remote=1' : 'view=1');
    }
    return;
  }
  if (mode !== design) { mode = design; frame.style.display = 'none'; frame.src = 'about:blank'; stage.style.display = 'block'; stage.classList.toggle('d3', design === '3d'); render.last = null; }
  st.design = design;
  const h = renderPlate(st);
  if (h !== render.last) { stage.innerHTML = h; render.last = h; }
}
let pend = 0; const schedule = () => { if (!pend) pend = setTimeout(() => { pend = 0; render(); }, 16); };
if (REMOTE) {
  const rs = document.getElementById('rs');
  const es = new EventSource('/api/events');
  es.onmessage = ev => {
    try {
      const m = JSON.parse(ev.data);
      if (m.full) for (const k in store) delete store[k];
      for (const k in m.data) { if (m.data[k] == null) delete store[k]; else store[k] = m.data[k]; }
      rs.textContent = ''; schedule();
    } catch (e) { }
  };
  es.onerror = () => { rs.textContent = '再接続中…'; };
} else {
  addEventListener('storage', e => { if (!e.key || /^(quiz_players|quiz_rules|qt_tournament|qt_intro)$/.test(e.key)) schedule(); });
}
render();
// 選手紹介（3D）：いま試合中の組の紹介が流れている間は上に重ねる（?nointro=1 で出さない）
if (!Q.get('nointro')) QTIntro.create({ get, key: 'qt_intro', accept: (T, I) => !!(T.current && T.current.gid === I.gid) });
</script>
</body>
